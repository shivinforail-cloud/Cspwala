name: Discover CSPWALA card tool package

on:
  push:
    paths:
      - '.github/workflows/build-card-tool-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public CSPWALA tool metadata and launch
        run: |
          set -euxo pipefail
          BASE='https://asia-south1-studio-9554958219-678f5.cloudfunctions.net'
          curl -fsS -X POST "$BASE/publicGetTool" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://tools.cspwala.in' \
            --data '{"data":{"idOrSlug":"smart-card-auto-crop"}}' \
            -o /tmp/tool.json
          echo '=== TOOL JSON ==='
          cat /tmp/tool.json
          TOOL_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/tool.json'))
          root=d.get('result',d.get('data',d))
          tool=root.get('tool',root)
          print(tool.get('id') or tool.get('toolId') or '')
          PY
          )
          echo "TOOL_ID=$TOOL_ID"
          test -n "$TOOL_ID"
          python3 - "$TOOL_ID" > /tmp/payload.json <<'PY'
          import json,sys
          print(json.dumps({'data':{'toolId':sys.argv[1]}}))
          PY
          curl -fsS -X POST "$BASE/publicGetToolLaunch" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://tools.cspwala.in' \
            --data-binary @/tmp/payload.json \
            -o /tmp/launch.json
          echo '=== LAUNCH JSON ==='
          cat /tmp/launch.json
          echo
          python3 - <<'PY'
          import json,re
          for f in ['/tmp/tool.json','/tmp/launch.json']:
              d=json.load(open(f))
              print('\nFILE',f)
              def walk(x,path=''):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          p=f'{path}.{k}' if path else k
                          if isinstance(v,(str,int,float,bool)) or v is None:
                              s=str(v)
                              if any(q in k.lower() for q in ['url','path','artifact','entry','zip','version','host','source','file','launch','asset']) or ('http' in s.lower()) or ('.zip' in s.lower()):
                                  print(p,'=',s)
                          walk(v,p)
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              walk(d)
          PY
