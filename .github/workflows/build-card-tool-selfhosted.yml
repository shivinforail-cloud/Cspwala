name: Inspect CSPWALA hosted tool

on:
  push:
    paths:
      - '.github/workflows/build-card-tool-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hosted route and inspect
        run: |
          set -euxo pipefail
          curl -iL --retry 2 --connect-timeout 20 'https://tools.cspwala.in/smart-card-auto-crop' -o /tmp/response.txt
          echo '--- RESPONSE START ---'
          cat /tmp/response.txt
          echo '--- RESPONSE END ---'
